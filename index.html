<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام إدارة الديون والتسديدات</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #16a34a;
      --warning: #eab308;
      --danger: #dc2626;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; line-height: 1.5; }
    .container { max-width: 900px; margin: 0 auto; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: var(--card); padding: 16px; border-radius: 12px; border: 1px solid var(--border); flex-wrap: wrap; gap: 10px; }
    h1 { font-size: 1.3rem; color: var(--text); }
    .header-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .total-badge { background: #eff6ff; color: var(--primary); padding: 8px 14px; border-radius: 8px; font-weight: bold; font-size: 0.95rem; }

    .card { background: var(--card); padding: 16px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
    .card-title { font-size: 1.05rem; font-weight: bold; }

    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
    input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.9rem; outline: none; }
    input:focus { border-color: var(--primary); }

    .search-box { margin-bottom: 14px; }

    .btn { background: var(--primary); color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 500; cursor: pointer; transition: 0.2s; text-decoration: none; display: inline-block; font-size: 0.9rem; }
    .btn:hover { background: var(--primary-hover); }
    .btn-success { background: var(--success); }
    .btn-whatsapp { background: #25d366; color: white; font-weight: bold; }
    .btn-warning { background: var(--warning); color: #000; }
    .btn-danger { background: var(--danger); }
    .btn-secondary { background: #475569; }
    .btn-sm { padding: 6px 12px; font-size: 0.82rem; }

    .table-responsive { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: right; }
    th, td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
    th { background: #f1f5f9; color: var(--text-muted); font-weight: 500; font-size: 0.85rem; }

    .actions { display: flex; gap: 4px; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); justify-content: center; align-items: center; padding: 16px; z-index: 100; }
    .modal.active { display: flex; }
    .modal-content { background: var(--card); padding: 20px; border-radius: 12px; width: 100%; max-width: 450px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>نظام إدارة الديون</h1>
    <div class="header-actions">
      <button class="btn btn-sm btn-secondary" onclick="exportBackup()">💾 حفظ نسخة</button>
      <button class="btn btn-sm btn-secondary" onclick="document.getElementById('import-file').click()">📂 استرجاع النسخة</button>
      <input type="file" id="import-file" style="display: none;" accept=".json" onchange="importBackup(event)">
      <div class="total-badge">مجموع الديون: <span id="total-debts">0</span> د.ع</div>
    </div>
  </header>

  <!-- نموذج إضافة زبون -->
  <div class="card">
    <div class="card-title">إضافة زبون جديد</div>
    <form id="add-customer-form" class="form-grid" style="margin-top: 10px;">
      <input type="text" id="name" placeholder="اسم الزبون" required>
      <input type="text" id="phone" placeholder="رقم الهاتف">
      <input type="text" id="address" placeholder="العنوان">
      <input type="number" id="amount" placeholder="مبلغ الدين" required min="0">
      <button type="submit" class="btn">حفظ الزبون</button>
    </form>
  </div>

  <!-- جدول عرض الديون مع خانة البحث -->
  <div class="card">
    <div class="card-title">قائمة الديون</div>
    <div class="search-box" style="margin-top: 10px;">
      <input type="text" id="search-input" placeholder="🔍 ابحث عن اسم الزبون..." oninput="render()">
    </div>
    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>الاسم</th>
            <th>الهاتف</th>
            <th>العنوان</th>
            <th>المبلغ المتبقي</th>
            <th>إجراءات</th>
          </tr>
        </thead>
        <tbody id="customers-list"></tbody>
      </table>
    </div>
  </div>

  <!-- واجهة سجل التسديدات مع زر إرسال للواتساب مباشرة -->
  <div class="card">
    <div class="card-header">
      <div class="card-title">سجل التسديدات</div>
      <button class="btn btn-sm btn-whatsapp" onclick="sendTodayPaymentsToWhatsApp()">📲 إرسال تسديدات اليوم للواتساب</button>
    </div>
    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>اسم الزبون</th>
            <th>المبلغ المسدد</th>
            <th>تاريخ ووقت التسديد</th>
          </tr>
        </thead>
        <tbody id="payments-history-list"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- نافذة التسديد -->
<div class="modal" id="pay-modal">
  <div class="modal-content">
    <div class="card-title">تسديد الدين</div>
    <p id="pay-customer-name" style="margin: 10px 0; color: var(--text-muted); font-weight: bold;"></p>
    <input type="number" id="pay-amount" placeholder="أدخل المبلغ المراد تسديده" min="1">
    <div class="modal-actions">
      <button class="btn btn-success" onclick="confirmPayment()">موافق</button>
      <button class="btn btn-danger" onclick="closeModal('pay-modal')">إلغاء</button>
    </div>
  </div>
</div>

<!-- نافذة التعديل -->
<div class="modal" id="edit-modal">
  <div class="modal-content">
    <div class="card-title">تعديل بيانات الزبون</div>
    <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 10px;">
      <input type="text" id="edit-name" placeholder="اسم الزبون">
      <input type="text" id="edit-phone" placeholder="رقم الهاتف">
      <input type="text" id="edit-address" placeholder="العنوان">
      <input type="number" id="edit-amount" placeholder="مبلغ الدين الكلي">
    </div>
    <div class="modal-actions">
      <button class="btn btn-warning" onclick="confirmEdit()">حفظ التعديلات</button>
      <button class="btn btn-danger" onclick="closeModal('edit-modal')">إلغاء</button>
    </div>
  </div>
</div>

<script>
  let customers = JSON.parse(localStorage.getItem('debts_data')) || [];
  let paymentsHistory = JSON.parse(localStorage.getItem('payments_history')) || [];
  let selectedCustomerId = null;

  function saveData() {
    localStorage.setItem('debts_data', JSON.stringify(customers));
    localStorage.setItem('payments_history', JSON.stringify(paymentsHistory));
    render();
  }

  function render() {
    const list = document.getElementById('customers-list');
    const historyList = document.getElementById('payments-history-list');
    const searchQuery = document.getElementById('search-input') ? document.getElementById('search-input').value.toLowerCase().trim() : '';
    
    list.innerHTML = '';
    historyList.innerHTML = '';
    let total = 0;

    const filteredCustomers = customers.filter(c => c.name.toLowerCase().includes(searchQuery));

    filteredCustomers.forEach(c => {
      total += Number(c.amount);
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><strong>${c.name}</strong></td>
        <td>${c.phone || '-'}</td>
        <td>${c.address || '-'}</td>
        <td style="color: var(--danger); font-weight: bold;">${Number(c.amount).toLocaleString()} د.ع</td>
        <td>
          <div class="actions">
            <button class="btn btn-sm btn-success" onclick="openPayModal('${c.id}')">تسديد</button>
            <button class="btn btn-sm btn-warning" onclick="openEditModal('${c.id}')">تعديل</button>
            <button class="btn btn-sm btn-danger" onclick="deleteCustomer('${c.id}')">حذف</button>
          </div>
        </td>
      `;
      list.appendChild(tr);
    });

    document.getElementById('total-debts').innerText = total.toLocaleString();

    paymentsHistory.slice().reverse().forEach(p => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><strong>${p.customerName}</strong></td>
        <td style="color: var(--success); font-weight: bold;">${Number(p.amount).toLocaleString()} د.ع</td>
        <td style="color: var(--text-muted); font-size: 0.85rem;">${p.dateTime}</td>
      `;
      historyList.appendChild(tr);
    });
  }

  document.getElementById('add-customer-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const newCustomer = {
      id: Date.now().toString(),
      name: document.getElementById('name').value,
      phone: document.getElementById('phone').value,
      address: document.getElementById('address').value,
      amount: parseFloat(document.getElementById('amount').value) || 0
    };
    customers.push(newCustomer);
    saveData();
    e.target.reset();
  });

  function openPayModal(id) {
    selectedCustomerId = id;
    const customer = customers.find(c => c.id === id);
    document.getElementById('pay-customer-name').innerText = `الزبون: ${customer.name} | المتبقي: ${customer.amount.toLocaleString()} د.ع`;
    document.getElementById('pay-amount').value = '';
    document.getElementById('pay-modal').classList.add('active');
  }

  function confirmPayment() {
    const amount = parseFloat(document.getElementById('pay-amount').value);
    if (!amount || amount <= 0) return;

    const customer = customers.find(c => c.id === selectedCustomerId);
    if (customer) {
      customer.amount = Math.max(0, customer.amount - amount);
      
      const now = new Date();
      const dateOnly = now.toLocaleDateString('ar-IQ');
      const dateTimeString = dateOnly + ' - ' + now.toLocaleTimeString('ar-IQ', { hour: '2-digit', minute: '2-digit' });
      
      paymentsHistory.push({
        customerName: customer.name,
        amount: amount,
        dateTime: dateTimeString,
        rawDate: dateOnly
      });

      saveData();
      closeModal('pay-modal');
    }
  }

  function sendTodayPaymentsToWhatsApp() {
    const today = new Date().toLocaleDateString('ar-IQ');
    const todayPayments = paymentsHistory.filter(p => p.rawDate === today);

    if (todayPayments.length === 0) {
      alert('لا توجد تسديدات مسجلة لهذا اليوم!');
      return;
    }

    let totalToday = todayPayments.reduce((sum, p) => sum + p.amount, 0);

    let message = `📋 *تقرير تسديدات اليوم*\n📅 *التاريخ:* ${today}\n━━━━━━━━━━━━━━━━━━━\n\n`;

    todayPayments.forEach((p, index) => {
      const timeOnly = p.dateTime.split('-')[1] || p.dateTime;
      message += `👤 *الزبون:* ${p.customerName}\n💵 *المبلغ المسدد:* ${p.amount.toLocaleString()} د.ع\n⏰ *الوقت:* ${timeOnly.trim()}\n-----------------------------------\n`;
    });

    message += `\n💰 *إجمالي تسديدات اليوم:* ${totalToday.toLocaleString()} د.ع\n━━━━━━━━━━━━━━━━━━━`;

    const targetPhone = '9647854777816';
    const whatsappUrl = `https://api.whatsapp.com/send?phone=${targetPhone}&text=${encodeURIComponent(message)}`;

    window.open(whatsappUrl, '_system');
  }

  function exportBackup() {
    const backupData = {
      customers: customers,
      paymentsHistory: paymentsHistory,
      exportDate: new Date().toISOString()
    };

    const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `نسخة_احتياطية_ديون_${new Date().toLocaleDateString('ar-IQ').replace(/\//g, '-')}.json`;
    a.click();
  }

  function importBackup(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const data = JSON.parse(e.target.result);
        if (data.customers && data.paymentsHistory) {
          if (confirm('هل تريد استبدال البيانات الحالية بالنسخة المحددة؟')) {
            customers = data.customers;
            paymentsHistory = data.paymentsHistory;
            saveData();
            alert('تم استرجاع البيانات بنجاح!');
          }
        } else {
          alert('الملف المحدد غير صالح!');
        }
      } catch (err) {
        alert('حدث خطأ أثناء قراءة الملف!');
      }
    };
    reader.readAsText(file);
  }

  function openEditModal(id) {
    selectedCustomerId = id;
    const customer = customers.find(c => c.id === id);
    document.getElementById('edit-name').value = customer.name;
    document.getElementById('edit-phone').value = customer.phone;
    document.getElementById('edit-address').value = customer.address;
    document.getElementById('edit-amount').value = customer.amount;
    document.getElementById('edit-modal').classList.add('active');
  }

  function confirmEdit() {
    const customer = customers.find(c => c.id === selectedCustomerId);
    if (customer) {
      customer.name = document.getElementById('edit-name').value;
      customer.phone = document.getElementById('edit-phone').value;
      customer.address = document.getElementById('edit-address').value;
      customer.amount = parseFloat(document.getElementById('edit-amount').value) || 0;
      saveData();
      closeModal('edit-modal');
    }
  }

  function deleteCustomer(id) {
    if (confirm('هل أنت تأكد من حذف هذا الزبون؟')) {
      customers = customers.filter(c => c.id !== id);
      saveData();
    }
  }

  function closeModal(modalId) {
    document.getElementById(modalId).classList.remove('active');
  }

  render();
</script>
</body>
</html>
